[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uvmcheck"
version = "0.1.0"
description = "Python Plugin SDK for UVMCheck Static Linter"
readme = "README.md"
authors = [{ name = "Mayur Kubavat", email = "mkubavat01@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
uvmcheck-plugins = "uvmcheck.plugin_runner:main"
uvmcheck-report = "uvmcheck.report:main"

# Only the SDK is packaged; examples/ and tests/ stay in the repository.
[tool.setuptools]
packages = ["uvmcheck"]
