name: uvmcheck
description: Lint SystemVerilog/UVM code with uvmcheck and upload the findings to GitHub code scanning (SARIF).
branding:
  icon: check-circle
  color: green

inputs:
  args:
    description: Extra uvmcheck arguments (sources, -f file lists, --preset ...). Empty uses .uvmcheck/config.py.
    required: false
    default: ""
  version:
    description: A released version to download (for example v0.2.0). Empty builds uvmcheck from the action's own source.
    required: false
    default: ""
  working-directory:
    description: Folder to run in (the project root).
    required: false
    default: "."
  changed-since:
    description: Report only findings on lines changed since this git ref (for example origin/main).
    required: false
    default: ""
  sarif-file:
    description: Where to write the SARIF report.
    required: false
    default: uvmcheck.sarif
  upload-sarif:
    description: Upload the SARIF report to code scanning (needs security-events write permission).
    required: false
    default: "true"
  fail-on-findings:
    description: Fail the step when uvmcheck reports errors.
    required: false
    default: "true"

outputs:
  sarif-file:
    description: Path of the SARIF report.
    value: ${{ steps.lint.outputs.sarif }}

runs:
  using: composite
  steps:
    # A released build when `version` names one; otherwise the native engine
    # is built from this checkout of the action (about two minutes the first
    # time, then cached). Neither needs a C++ toolchain.
    - name: Download uvmcheck
      if: inputs.version != ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        DEST: ${{ runner.temp }}/uvmcheck-release
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=linux-x64 ;;
          Linux-ARM64) target=linux-arm64 ;;
          macOS-ARM64) target=darwin-arm64 ;;
          macOS-X64) target=darwin-x64 ;;
          *) echo "uvmcheck has no release build for $RUNNER_OS-$RUNNER_ARCH; leave 'version' empty to build it" >&2; exit 2 ;;
        esac
        mkdir -p "$DEST"
        curl -fsSL "https://github.com/mayurkubavat/svlang/releases/download/$VERSION/uvmcheck-$target.tar.gz" \
          | tar -xz -C "$DEST" --strip-components=1
        echo "UVMCHECK=$DEST/bin/uvmcheck" >> "$GITHUB_ENV"

    - name: Restore uvmcheck build
      if: inputs.version == ''
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ github.action_path }}/target/release/uvmcheck
        key: uvmcheck-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/crates/**', github.action_path), format('{0}/Cargo.lock', github.action_path), format('{0}/testdata/rules/**', github.action_path)) }}

    - name: Build uvmcheck
      if: inputs.version == '' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        if ! command -v cargo >/dev/null; then
          echo "uvmcheck: no Rust toolchain on this runner; install one (1.82 or later) or set the action's 'version' input to a release" >&2
          exit 2
        fi
        cargo build --release --locked -p dv-lint --bin uvmcheck

    - name: Use the built uvmcheck
      if: inputs.version == ''
      shell: bash
      run: echo "UVMCHECK=${{ github.action_path }}/target/release/uvmcheck" >> "$GITHUB_ENV"

    - name: Lint
      id: lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ARGS: ${{ inputs.args }}
        CHANGED: ${{ inputs.changed-since }}
        SARIF: ${{ inputs.sarif-file }}
        FAIL: ${{ inputs.fail-on-findings }}
      run: |
        extra=()
        if [ -n "$CHANGED" ]; then extra+=(--changed-since "$CHANGED"); fi
        set +e
        # shellcheck disable=SC2086  # ARGS is a word list on purpose
        "$UVMCHECK" $ARGS "${extra[@]}" --sarif "$SARIF"
        status=$?
        set -e
        echo "sarif=$SARIF" >> "$GITHUB_OUTPUT"
        if [ "$status" -ge 2 ]; then exit "$status"; fi
        if [ "$status" -eq 1 ] && [ "$FAIL" = "true" ]; then echo "failed=true" >> "$GITHUB_OUTPUT"; fi

    - name: Upload SARIF
      if: always() && inputs.upload-sarif == 'true' && steps.lint.outputs.sarif != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.working-directory }}/${{ inputs.sarif-file }}
        category: uvmcheck

    - name: Fail on findings
      if: steps.lint.outputs.failed == 'true'
      shell: bash
      run: |
        echo "uvmcheck reported errors; see the code scanning alerts or the log above."
        exit 1
