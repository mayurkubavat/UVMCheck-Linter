name: Release

# On a version tag: build the native tools (uvmcheck, dv-lsp, dv-build,
# dv-map, dv-filelist) for Linux x64/arm64 and macOS arm64/x64 and attach
# them to the GitHub release as uvmcheck-<target>.tar.gz. The C++ engine on
# Slang is built too, as uvmcheck-slang-<target>.tar.gz. The VS Code
# extension is packaged once per platform with dv-lsp inside: one native
# server for lint diagnostics, quick fixes and code browsing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  native:
    name: native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are built in manylinux_2_28, so they run on any
          # distribution with glibc 2.28 or later (RHEL 8, Ubuntu 20.04).
          # Not musl: its allocator makes the parallel rule run about ten
          # times slower.
          - os: ubuntu-24.04
            target: linux-x64
            triple: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            triple: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64
          - os: macos-15
            target: darwin-arm64
            triple: aarch64-apple-darwin
          - os: macos-15
            target: darwin-x64
            triple: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --target ${{ matrix.triple }}
          rustup default stable

      - name: Build
        shell: bash
        run: cargo build --locked --profile dist --target ${{ matrix.triple }}

      - name: Package
        shell: bash
        run: tools/release/package.sh "target/${{ matrix.triple }}/dist" "${{ matrix.target }}" dist

      - name: Smoke test
        # The x64 macOS binaries run under Rosetta on the arm64 runner.
        shell: bash
        run: tools/release/smoke.sh "dist/uvmcheck-${{ matrix.target }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/uvmcheck-${{ matrix.target }}.tar.gz

  slang:
    name: slang (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build
        run: cmake --preset reference && cmake --build build -j 4 --target uvmcheck

      - name: Smoke test
        run: |
          ./build/uvmcheck --list-rules --json > /dev/null
          python3 cpp/tests/regression.py --binary build/uvmcheck

      - name: Package
        run: |
          mkdir -p dist/uvmcheck-slang-${{ matrix.target }}/bin
          cp build/uvmcheck dist/uvmcheck-slang-${{ matrix.target }}/bin/uvmcheck-slang
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md dist/uvmcheck-slang-${{ matrix.target }}/
          tar -C dist -czf "dist/uvmcheck-slang-${{ matrix.target }}.tar.gz" "uvmcheck-slang-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: slang-${{ matrix.target }}
          path: dist/uvmcheck-slang-${{ matrix.target }}.tar.gz

  publish:
    needs: [native, slang]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package the VS Code extension per platform
        working-directory: editors/vscode
        run: |
          npm install
          for target in linux-x64 darwin-arm64; do
            rm -rf bin stage && mkdir -p "bin/$target" stage
            tar -C stage -xzf "../../artifacts/uvmcheck-$target.tar.gz"
            # The one server the extension starts.
            cp "stage/uvmcheck-$target/bin/dv-lsp" "bin/$target/dv-lsp"
            chmod +x "bin/$target/dv-lsp"
            npx vsce package --target "$target" -o "../../artifacts/uvmcheck-vscode-$target.vsix"
          done
          rm -rf stage

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum uvmcheck-*.tar.gz uvmcheck-vscode-*.vsix > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            uvmcheck-*.tar.gz uvmcheck-vscode-*.vsix SHA256SUMS
