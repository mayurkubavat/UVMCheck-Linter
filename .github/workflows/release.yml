name: Release

# On a version tag: build uvmcheck for Linux x64 and macOS arm64, attach the
# binaries to the GitHub release, and package the VS Code extension once per
# platform with that platform's binary inside.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binary:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build
        run: cmake --preset default && cmake --build build -j 4 --target uvmcheck

      - name: Smoke test
        run: |
          ./build/uvmcheck --list-rules --json > /dev/null
          python3 cpp/tests/regression.py --binary build/uvmcheck

      - name: Package
        run: |
          mkdir -p dist
          tar -C build -czf "dist/uvmcheck-${{ matrix.target }}.tar.gz" uvmcheck

      - uses: actions/upload-artifact@v4
        with:
          name: uvmcheck-${{ matrix.target }}
          path: |
            build/uvmcheck
            dist/uvmcheck-${{ matrix.target }}.tar.gz

  publish:
    needs: binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package the VS Code extension per platform
        working-directory: editors/vscode
        run: |
          npm install
          for target in linux-x64 darwin-arm64; do
            rm -rf bin && mkdir -p "bin/$target"
            cp "../../artifacts/uvmcheck-$target/build/uvmcheck" "bin/$target/uvmcheck"
            chmod +x "bin/$target/uvmcheck"
            npx vsce package --target "$target" -o "../../artifacts/uvmcheck-vscode-$target.vsix"
          done

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            artifacts/uvmcheck-*/dist/uvmcheck-*.tar.gz \
            artifacts/uvmcheck-vscode-*.vsix
