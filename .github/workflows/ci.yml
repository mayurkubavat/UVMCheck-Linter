name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned Accellera uvm-core release used by the real-library rule tests
  UVM_CORE_REF: 2020.3.1

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build build -j 4

      - uses: actions/upload-artifact@v4
        with:
          name: uvmcheck
          path: build/uvmcheck
          retention-days: 3

  test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: isolated rules, UVM stub
            args: --mode isolated
          - suite: all rules, UVM stub
            args: --mode all-rules --baseline tests/baselines/all_rules_stub.json
          - suite: all rules, real uvm-core
            args: --mode all-rules --uvm-home uvm-core --baseline tests/baselines/all_rules_uvm_core.json
            needs_uvm: true
          - suite: LSP integration
            lsp: true
    name: test (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: uvmcheck
          path: build

      - run: chmod +x build/uvmcheck

      - name: Fetch uvm-core
        if: matrix.needs_uvm
        run: git clone --depth 1 --branch "$UVM_CORE_REF" https://github.com/accellera-official/uvm-core.git uvm-core

      - name: Rule tests
        if: ${{ !matrix.lsp }}
        run: python3 tests/regression.py --binary build/uvmcheck ${{ matrix.args }}

      - name: LSP test
        if: matrix.lsp
        run: python3 tests/test_lsp.py
