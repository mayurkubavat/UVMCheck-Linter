name: Rust

# The native Rust tools (dv-lint, dv-lsp, dv-build, dv-map, dv-filelist):
# format and Clippy gate, then the tests, with default features only. The
# `slang` feature needs the C++ model library and is not built here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  gate:
    name: gate (stable)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-stable-

      - name: rust_gate (profiles, fmt, Clippy -D warnings)
        run: tools/gates/rust_gate.sh --native

      - name: cargo test
        run: cargo test --locked

  msrv:
    name: test (MSRV 1.82, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install 1.82 --profile minimal
          rustup default 1.82

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-1.82-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-1.82-

      - name: cargo test
        run: cargo test --locked

  package:
    # What the Release workflow ships, built and checked on every change:
    # the dist profile, the archive layout and a lint run from the unpacked
    # archive (tools/release/).
    name: release archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build
        run: cargo build --locked --profile dist

      - name: Package and smoke test
        run: |
          tools/release/package.sh target/dist linux-x64 dist
          tools/release/smoke.sh dist/uvmcheck-linux-x64.tar.gz
