[package]
name = "sv-sema"
description = "Native symbols for SystemVerilog: the class model of dv-model built from sv-syntax trees"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
sv-syntax = { path = "../sv-syntax" }
sv-source = { path = "../sv-source" }
dv-model = { path = "../dv-model", default-features = false }

[dev-dependencies]
# The examples and tests compare against the slang-backed model.
dv-model = { path = "../dv-model" }
