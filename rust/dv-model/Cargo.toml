[package]
name = "dv-model"
description = "Safe, owned model of a SystemVerilog/UVM design for DV tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = ["slang"]
# Load designs through slang (needs libuvmcheck_model).
slang = ["dep:sv-slang"]

[dependencies]
sv-slang = { path = "../sv-slang", optional = true }
