# The Rust workspace: the native SystemVerilog/UVM front end and the DV tools.
# Crates live in crates/; see docs/architecture/rust.md. Tools depend on dv-model
# only; sv-slang is the raw binding to libuvmcheck_model (slang behind a C ABI)
# and is the one crate that changes when the front end does.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[profile.release]
debug = 1
