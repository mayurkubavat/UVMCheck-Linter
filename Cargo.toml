# The Rust workspace: the native SystemVerilog/UVM front end and the DV tools.
# Crates live in crates/; see docs/architecture/rust.md. Tools depend on dv-model
# only; sv-slang is the raw binding to libuvmcheck_model (slang behind a C ABI)
# and is the one crate that changes when the front end does.
[workspace]
resolver = "2"
members = ["crates/*"]
# Everything but the Slang bridge: a plain `cargo build` / `cargo test` needs no
# C++ build. sv-slang (the C ABI binding to libuvmcheck_model) is built only
# when a crate's `slang` feature asks for it; see third_party/slang/README.md.
default-members = [
    "crates/sv-source", "crates/sv-lexer", "crates/sv-preproc", "crates/sv-syntax", "crates/sv-sema",
    "crates/dv-model", "crates/dv-lint", "crates/dv-lsp", "crates/dv-build", "crates/dv-map",
    "crates/dv-filelist",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[profile.release]
debug = 1
