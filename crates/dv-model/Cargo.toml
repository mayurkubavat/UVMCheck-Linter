[package]
name = "dv-model"
description = "Safe, owned model of a SystemVerilog/UVM design for DV tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = []
# `Design::load`: load designs through Slang over the C ABI (needs
# libuvmcheck_model from `cmake --preset model`). Oracle and parity use only;
# the native loader is `sv_sema::load`. See third_party/slang/README.md.
slang = ["dep:sv-slang"]

[[test]]
name = "load"
required-features = ["slang"]

[dependencies]
sv-slang = { path = "../sv-slang", optional = true }
