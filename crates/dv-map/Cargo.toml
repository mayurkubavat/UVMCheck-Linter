[package]
name = "dv-map"
description = "Prints a UVM testbench's component tree, from dv-model"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[dependencies]
dv-model = { path = "../dv-model", default-features = false }
svlang = { path = "../svlang" }
# Only for the rpath to libuvmcheck_model (build.rs), with the slang feature.
sv-slang = { path = "../sv-slang", optional = true }

[features]
default = []
# `--slang`: build the map from the Slang-backed model instead of the native
# one (needs libuvmcheck_model). Oracle and parity use only.
slang = ["dep:sv-slang", "dv-model/slang"]
