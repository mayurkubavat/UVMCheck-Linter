[package]
name = "sv-sema"
description = "Native symbols for SystemVerilog: the class model of dv-model built from sv-syntax trees"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
sv-syntax = { path = "../sv-syntax" }
sv-source = { path = "../sv-source" }
dv-model = { path = "../dv-model", default-features = false }

[features]
default = []
# The model_dump example's `--slang` (the model_parity gate): the Slang-backed
# model to compare against. Oracle use only.
slang = ["dv-model/slang"]

[[example]]
name = "model_dump"
required-features = ["slang"]
