[package]
name = "dv-lint"
description = "UVMCheck: the SystemVerilog/UVM linter on the native front end (binaries uvmcheck and dv-lint)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

# One program under two names: `uvmcheck` is the product's command, `dv-lint`
# the name the gates and scripts call. Both run `dv_lint::app::run`.
[[bin]]
name = "dv-lint"
path = "src/main.rs"

[[bin]]
name = "uvmcheck"
path = "src/uvmcheck.rs"

[features]
default = []
# `--slang`: load the design through Slang instead of the native front end
# (needs libuvmcheck_model). Oracle and parity use only, never the default.
slang = ["dv-model/slang"]

[dependencies]
dv-model = { path = "../dv-model", default-features = false }
svlang = { path = "../svlang" }
# Waiver, header and naming patterns (src/pattern.rs): bytes, ASCII, no
# Unicode tables or SIMD literal search; the inputs are one line long.
regex = { version = "1.13", default-features = false, features = ["std"] }

